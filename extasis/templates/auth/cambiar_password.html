{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Cambiar contraseña</h1>
  {% if g.user.debe_cambiar_password %}<div class="sub">Estás usando una contraseña de prueba. Elegí una nueva para continuar.</div>{% endif %}</div></div>
<div class="card" style="max-width:480px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Contraseña actual</label><input type="password" name="actual" autocomplete="current-password" required></div>
    <div class="field"><label>Nueva contraseña</label><input type="password" name="nueva" autocomplete="new-password" minlength="8" required>
      <small>Mínimo 8 caracteres, con letras y números.</small></div>
    <div class="field"><label>Repetir nueva contraseña</label><input type="password" name="repetir" autocomplete="new-password" minlength="8" required></div>
    <button class="btn btn-primary btn-block" type="submit"><i data-lucide="key-round"></i>Guardar contraseña</button>
  </form>
</div>
{% endblock %}
